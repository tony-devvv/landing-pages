<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100svh;display:grid;place-items:center;background:#14161A;color:#F5F2EC;font-family:"Inter",Arial,sans-serif;padding:24px;text-align:center}
main{display:grid;gap:18px;justify-items:center;max-width:520px}
.code{font-family:"IBM Plex Mono","Space Mono",monospace;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#C9C4BA}
h1{font-family:"Archivo",Arial,sans-serif;font-stretch:112%;font-weight:600;font-size:clamp(34px,7vw,56px);line-height:1.05;letter-spacing:-.02em}
p{color:#C9C4BA;line-height:1.5}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
a{display:inline-block;font-weight:500;text-decoration:none;padding:13px 20px;border-radius:999px;background:#F5F2EC;color:#14161A}
a.alt{background:transparent;color:#F5F2EC;box-shadow:inset 0 0 0 1.5px #3A3E46}
a:focus-visible{outline:2px solid #FF5A1F;outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="code">Errore 404</span>
  <h1>Qui c'è solo silenzio.</h1>
  <p>La pagina che cerchi non esiste o è stata spostata.</p>
  <div class="links">
    <a href="/verso/">Vai a Vèrso One</a>
    <a class="alt" href="/">Landing Headphone (1) Pro</a>
  </div>
</main>
</body>
</html>
